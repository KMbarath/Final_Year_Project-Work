global_rules:
  system_prompt_prefix: |
    - Respond with the final answer only.
    - Avoid loops in reasoning move to the next field immediately if uncertain.
    - OCR text may include content from multiple document types in one payload. Extract only fields for the requested document type; ignore unrelated document content.
    - OCR text may include Arabic (العربية) and English, especially for UAE documents such as Emirates ID and Trade License. Read both scripts. Return values exactly as printed; when a field appears in both scripts, populate English/Latin script fields from the English label block and Arabic script fields from the Arabic label block.

  json_schema_title: |
    STRICT OUTPUT SCHEMA (Don't give other than this json, no explantions)

  logical_score_instruction: |
    logical_score should be between 0.0 and 1.0. Use simple confidence; avoid overconfidence.

  user_prompt_template: |
    Extract the values from the {doc_type} OCR text and return only the list of JSON (OUTPUT SCHEMA) as below. If any value is not found, return null.



aadhaar:
  system_prompt: |

  user_prompt: |
    ## Rule for extraction:
    ### Aadhaar number extraction:
      - Extract Aadhaar only from the bottom section.
      - Aadhaar must be a clean standalone 12-digit number may be with space in between. Return the value without space.
      - DO NOT extract or split digits from the following:
          - Enrollment ID (28-digit or 14-digit formats)
          - Virtual ID (16-digit VID)
          - Any long digit sequences (13+ digits)
          - Any number with letters, spaces, or special characters inside it
    ### Address extraction:
      - Return address without OCR noise,
      - Return address without father name and relationship type. Like "S/O, D/O, W/O, etc.,

  normal_schema: |
    {
        "name": { "value": null },
        "aadhaar_no": { "value": null },
        "father_name": { "value": null },
        "dob": { "value": null },
        "gender": { "value": null },
        "address": { "value": null }
    }

  logical_schema: |
    {
        "name": { "value": null, "logical_score": 0.0 },
        "aadhaar_no": { "value": null, "logical_score": 0.0 },
        "father_name": { "value": null, "logical_score": 0.0 },
        "dob": { "value": null, "logical_score": 0.0 },
        "gender": { "value": null, "logical_score": 0.0 },
        "address": { "value": null, "logical_score": 0.0 }
    }


affiliation_certificate:
  system_prompt: |
    - institution_name: Full name of the university, college, or higher education institution as stated on the certificate.
    - institution_type: Type if mentioned (e.g. University, College, Deemed to be University, Institution of National Importance); return null if not stated.
    - certificate_type: Whether the document is for affiliation, recognition, approval, or similar; return as printed.
    - certificate_number: Affiliation, recognition, or approval reference/order/certificate number.
    - ugc_reference_number: UGC letter, order, or file reference number if present.
    - affiliated_to_university: Parent or affiliating university name if the institution is a college or affiliated institution; return null for standalone universities where not applicable.
    - address: Address or location of the institution if stated.
    - state: State where the institution is located, if mentioned.
    - recognition_date: Date of recognition, affiliation, or approval; use DD/MM/YYYY when day/month/year can be inferred.
    - valid_from: Effective or validity start date if mentioned; use DD/MM/YYYY when possible.
    - valid_upto: Validity end date if mentioned; use DD/MM/YYYY when possible.
    - courses_or_programs: Courses, programmes, or levels of study covered by the affiliation/recognition if listed; return as concise text.
    - issuing_authority: Competent authority issuing the certificate (e.g. University Grants Commission, UGC); return as printed.

  user_prompt: |
    Extract details from a UGC Affiliation / Recognition Certificate or similar document establishing educational recognition or affiliation of a university, college, or higher education institution under the University Grants Commission or competent authority framework. Keep dates in DD/MM/YYYY where possible.

  normal_schema: |
    {
      "institution_name": { "value": null },
      "institution_type": { "value": null },
      "certificate_type": { "value": null },
      "certificate_number": { "value": null },
      "ugc_reference_number": { "value": null },
      "affiliated_to_university": { "value": null },
      "address": { "value": null },
      "state": { "value": null },
      "recognition_date": { "value": null },
      "valid_from": { "value": null },
      "valid_upto": { "value": null },
      "courses_or_programs": { "value": null },
      "issuing_authority": { "value": null }
    }

  logical_schema: |
    {
      "institution_name": { "value": null, "logical_score": 0.0 },
      "institution_type": { "value": null, "logical_score": 0.0 },
      "certificate_type": { "value": null, "logical_score": 0.0 },
      "certificate_number": { "value": null, "logical_score": 0.0 },

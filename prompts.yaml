board_resolution:
  system_prompt: |
    Extract details from the Board Resolution. Keep dates in DD/MM/YYYY where possible.
    - company_name: Company or organization that issued the resolution.
    - resolution_date: Date the resolution was passed or issued.
    - mode_of_operation_summary: Extract the separate summary for open_account, operate_account and operate_netbanking. Return one complete sentence for each distinct operation rule. It must be inclusive of all authorized person names, designations, operation type (singly, jointly, any two jointly, severally, etc.), monetary limits or thresholds, conditions and restrictions.
      - Preserve wording from the document; do not infer rules not stated.
      - for open_account, return the summary of the authorized persons names and designations who are authorized to open the account. dont include the limits and conditions.
      - for operate_account, return the summary of the authorized persons names and designations who are authorized to operate the account along with all operation type (singly, jointly, any two jointly, severally, etc.), limits,rules and conditions.
      - for operate_netbanking, return the summary of the authorized persons names and designations who are authorized to operate the internet banking along with all operation type (singly, jointly, any two jointly, severally, etc.), limits,rules and conditions.
      - Return null if no instruction exists for that operation type.
      - Examples:
        - "Mrs. Priyanka Roy and Mrs. Durga Patil jointly operate the account"
        - "Mr. Abhishek Singh (Director) singly up to INR 10 Crore"
        - "Mr. Bhavesh Patel (CFO) jointly with Mr. C. K. Verma (Director) above INR 50 Crore"
        - "Any two directors jointly for all banking transactions"
        - "Mr. Manoj Kumar (Director) singly for all banking transactions"
    - authorized_persons: list of authorized persons who are authorized to open the account, operate the account and operate the netbanking. Extract the authorized person details from the latest letter of authorization or addendum to the board resolution if it was issued after the board resolution was passed. name is the name of the person and designation is the designation of the person.
    - authorizer_details: Extract the authorizer details from the latest Board Resolution or Letter of Authorization, where the authorizer is the person signing, certifying, or authorizing the document on behalf of the organization, In some cases, an authorized person may also be the authorizer if they are the signatory, extract name, designation, and din_or_membership_number (DIN, ICSI, ICAI, CA, or any other explicitly mentioned membership/registration number).

  user_prompt: |

  normal_schema: |
    {
      "company_name": { "value": null },
      "resolution_date": { "value": null },
      "resolutions": {
        "open_account": { "mode_of_operation_summary": { "value": null } },
        "operate_account": { "mode_of_operation_summary": { "value": null } },
        "operate_netbanking": { "mode_of_operation_summary": { "value": null } }
      },
      "authorized_persons": [
        {
          "name": { "value": null },
          "designation": { "value": null }
        }
      ],
      "authorizer_details": [
        {
          "name": { "value": null },
          "designation": { "value": null },
          "din_or_membership_number": { "value": null }
        }
      ]
    }

  logical_schema: |
    {
      "company_name": { "value": null, "logical_score": 0.0 },
      "resolution_date": { "value": null, "logical_score": 0.0 },
      "resolutions": { "open_account": { "mode_of_operation_summary": { "value": null, "logical_score": 0.0 } }, "operate_account": { "mode_of_operation_summary": { "value": null, "logical_score": 0.0 } }, "operate_netbanking": { "mode_of_operation_summary": { "value": null, "logical_score": 0.0 } } },
      "authorized_persons": [
        {
          "name": { "value": null, "logical_score": 0.0 },
          "designation": { "value": null, "logical_score": 0.0 }
        }
      ],

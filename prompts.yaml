    partner: list each partner shown on the license with their details.

    When documentMismatchReason is set, leave all extraction fields null and partner as an empty array.

  user_prompt: |
    Do not extract PO box-only addresses; prefer the licensed business / office address when shown.
    Use the JSON key "partner" (not proprietor or partners) for the partner list.
    Reject proprietorship trade licenses explicitly via documentMismatchReason — do not return null extraction without a reason when the license shows a single proprietor only.

  normal_schema: |
    {
      "isTradeLicense": { "value": null },
      "detectedStructure": { "value": null },
      "documentMismatchReason": { "value": null },
      "companyName": { "value": null },
      "tradeName": { "value": null },
      "licenseNumber": { "value": null },
      "issueDate": { "value": null },
      "expiryDate": { "value": null },
      "emirates": { "value": null },
      "address": { "value": null },
      "licenseAuthority": { "value": null },
      "partner": [
        {
          "name": { "value": null },
          "nationality": { "value": null },
          "emiratesId": { "value": null },
          "passportNumber": { "value": null },
          "sharePercentage": { "value": null }

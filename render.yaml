services:
  - type: web
    name: folio-document-ai
    runtime: docker
    plan: free
    healthCheckPath: /api/status
    envVars:
      - key: FOLIO_DATA_DIR
        value: /tmp/folio-data
      - key: FOLIO_SECURE_COOKIES
        value: "1"
      - key: FOLIO_PUBLIC_URL
        sync: false
      - key: FOLIO_ALLOWED_HOSTS
        sync: false
      - key: FOLIO_OLLAMA_URL
        sync: false
      - key: FOLIO_OLLAMA_MODEL
        sync: false
      - key: FOLIO_EXTRACTION_MODEL
        sync: false
      - key: FOLIO_REQUIRE_MODELS
        value: "0"
      - key: FOLIO_PIPER_MODEL
        value: /app/artifacts/voices/en_US-lessac-medium.onnx

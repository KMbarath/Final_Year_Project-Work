[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "folio-document-assistant"
version = "0.1.0"
description = "Local personal document assistant with reproducible model training"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18", "pymupdf>=1.24,<2", "pillow>=10", "numpy>=1.26,<3", "scikit-learn>=1.5,<2", "joblib>=1.4", "httpx>=0.27,<1"]

[project.optional-dependencies]
training = ["torch>=2.6", "transformers>=4.48,<6", "matplotlib>=3.8", "pandas>=2.2", "nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6", "jupyterlab>=4"]
semantic = ["sentence-transformers>=3,<6", "faiss-cpu>=1.8"]
ocr = ["paddleocr>=3,<4", "paddlepaddle>=3,<4"]
entities = ["gliner>=0.2,<1"]
voice = ["openai-whisper>=20240930", "piper-tts>=1.3,<2", "imageio-ffmpeg>=0.5"]
translation = ["transformers>=4.48,<5", "sentencepiece", "IndicTransToolkit"]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["folio*", "training*"]

[tool.setuptools.package-data]
folio = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
